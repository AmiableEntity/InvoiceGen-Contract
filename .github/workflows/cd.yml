name: CD — Deploy to Stellar Testnet

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build, Optimize & Deploy Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build WASM (release)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Optimize WASM
        run: |
          stellar contract optimize \
            --wasm target/wasm32-unknown-unknown/release/stellar_invoice.wasm

      - name: Import deployer identity
        run: |
          echo "${{ secrets.STELLAR_DEPLOYER_SECRET }}" | \
            stellar keys add deployer --secret-key

      - name: Deploy contract
        id: deploy
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/stellar_invoice.optimized.wasm \
            --source deployer \
            --network testnet)
          echo "contract_id=$CONTRACT_ID" >> $GITHUB_OUTPUT
          echo "Deployed contract: $CONTRACT_ID"

      - name: Initialize contract
        run: |
          stellar contract invoke \
            --id ${{ steps.deploy.outputs.contract_id }} \
            --source deployer \
            --network testnet \
            -- initialize \
            --admin "$(stellar keys address deployer)"

      - name: Save contract ID as summary
        run: |
          echo "## Contract Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Contract ID:** \`${{ steps.deploy.outputs.contract_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** testnet" >> $GITHUB_STEP_SUMMARY
