name: Bug Report
description: Report a bug in the smart contract
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: function
    attributes:
      label: Which function triggered the bug?
      placeholder: e.g. mark_paid() with invoice_id "inv-001"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior (panic message, wrong return value, etc.)
    validations:
      required: true

  - type: input
    id: network
    attributes:
      label: Network
      placeholder: testnet or mainnet
